[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quotestack"
version = "0.1.0"
description = "Multi-source market data adapter for A-shares, US stocks, mutual funds and crypto."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "whyxian" }]
keywords = ["market-data", "stock", "fund", "crypto", "finance", "a-share"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "prometheus-client>=0.20"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.9",
  "mypy>=1.13",
  "pre-commit>=3.8",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[project.scripts]
quotestack = "quotestack.cli:main"
quotestack-server = "quotestack.server.__main__:main"

[project.urls]
Homepage = "https://github.com/whyxian/quotestack#readme"
Repository = "https://github.com/whyxian/quotestack"
Issues = "https://github.com/whyxian/quotestack/issues"
Changelog = "https://github.com/whyxian/quotestack/blob/main/CHANGELOG.md"
Documentation = "https://github.com/whyxian/quotestack/blob/main/guide/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/quotestack"]

[tool.hatch.build.targets.sdist]
include = ["src/quotestack", "tests", "README.md", "LICENSE"]
# hatchling force-includes every file named README.md, which dragged the index
# pages in on their own: their links all point at siblings that are not in the
# archive, so a reader got four broken tables of contents. The docs live on
# GitHub; a source archive is for building.
exclude = ["/docs", "/guide"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown code blocks are illustrative: they align comments for readability,
# and they contain deliberate fragments (`...`, undefined storage helpers).
# ruff >=0.14 reformats Python inside Markdown, which flattens that alignment,
# so no Markdown is formatted or linted. The pre-commit hooks already limit
# themselves to Python files; excluding here keeps `ruff format --check .`
# agreeing with them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "RET",   # return
  "PTH",   # pathlib
  "ASYNC", # async pitfalls
  "RUF",   # ruff-specific
  "T20",   # no print
]
ignore = [
  "E501",  # line length handled by formatter
  # This project parses Chinese financial data, so full-width punctuation and
  # the multiplication sign appear in literals on purpose. These rules exist to
  # catch Latin/Cyrillic lookalikes, which do not occur here.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]              # tests may print for debugging
"src/quotestack/cli.py" = ["T20"]
"src/quotestack/server/__main__.py" = ["T20"]  # a server entry point reports to stderr
"benchmarks/*.py" = ["T20"]  # a CLI exists to print
"examples/*.py" = ["T20"]    # examples exist to print
"scripts/*.py" = ["T20"]     # report scripts exist to print

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
files = ["src"]

[tool.coverage.run]
source = ["quotestack"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real data sources, opt in with QUOTESTACK_LIVE=1"]
addopts = "-q"
