[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quotestack"
version = "0.0.1"
description = "Multi-source market data adapter for A-shares, US stocks, mutual funds and crypto."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "whyxian" }]
keywords = ["market-data", "stock", "fund", "crypto", "finance", "a-share"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "prometheus-client>=0.20"]
cache = ["aiosqlite>=0.20"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.9",
  "mypy>=1.13",
  "pre-commit>=3.8",
]

[project.scripts]
quotestack = "quotestack.cli:main"
quotestack-server = "quotestack.server.__main__:main"

[project.urls]
Repository = "https://github.com/whyxian/quotestack"

[tool.hatch.build.targets.wheel]
packages = ["src/quotestack"]

[tool.hatch.build.targets.sdist]
include = ["src/quotestack", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Docs contain illustrative code snippets; formatting them causes churn
# (ruff >=0.14 formats Python code blocks inside Markdown).
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "RET",   # return
  "PTH",   # pathlib
  "ASYNC", # async pitfalls
  "RUF",   # ruff-specific
  "T20",   # no print
]
ignore = [
  "E501",  # line length handled by formatter
  # This project parses Chinese financial data, so full-width punctuation and
  # the multiplication sign appear in literals on purpose. These rules exist to
  # catch Latin/Cyrillic lookalikes, which do not occur here.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]              # tests may print for debugging
"src/quotestack/cli.py" = ["T20"]
"src/quotestack/server/__main__.py" = ["T20"]  # a server entry point reports to stderr
"benchmarks/*.py" = ["T20"]  # a CLI exists to print

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real data sources, opt in with QUOTESTACK_LIVE=1"]
addopts = "-q"
