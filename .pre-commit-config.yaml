# Hooks run the tools from this project's venv, not pinned copies downloaded by
# pre-commit. Two reasons: the versions always match pyproject.toml, and nothing
# is fetched from the network on first run.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # Runs after the formatter, because formatting changes line counts and
      # the generated tables quote them. Committing stale tables is then
      # impossible rather than merely discouraged.
      - id: sync-docs
        name: sync docs
        entry: .venv/bin/python scripts/sync_docs.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src
        language: system
        pass_filenames: false
        types_or: [python, pyi]
