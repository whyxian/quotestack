name: live probe

# Fixtures are snapshots: if a source changes shape they still pass. Only a
# real request notices, so this needs to run against the live endpoints.
#
# It is manual-only on purpose. GitHub's runners sit outside mainland China,
# and the sources this library targets routinely refuse a datacenter IP, so a
# scheduled run would report the runner's location rather than the payloads.
# Run it from a network where the sources are actually reachable:
#
#   GitHub UI   -> Actions -> live probe -> Run workflow
#   CLI         -> gh workflow run live-probe.yml
#   Local       -> QUOTESTACK_LIVE=1 uv run pytest tests/test_smoke.py -q
#
# Transport failures skip; a payload that stops parsing fails. That difference
# is the whole signal.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: "把跳过也当成失败（用于确认真能连通）"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra server
      - name: Probe the parsing of live payloads
        env:
          QUOTESTACK_LIVE: "1"
        run: |
          set -o pipefail
          uv run pytest tests/test_smoke.py -q -rs | tee /tmp/probe.txt
      - name: Fail when nothing could be reached
        if: inputs.strict
        run: |
          # A run where every test skipped proves nothing. Leaving a green tick
          # over an empty result is how a probe becomes decoration.
          if ! grep -q "passed" /tmp/probe.txt; then
            echo "::error::every probe skipped; this runner cannot reach the sources"
            exit 1
          fi
