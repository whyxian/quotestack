name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra server
      # The hooks are the single definition of what is enforced. Running them
      # in CI rather than duplicating the commands keeps the file sets and
      # flags from drifting apart, which is how an unformatted markdown file
      # once passed every commit and failed the build.
      - name: Hooks (lint, format, types)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: uv run pytest -q --cov=quotestack --cov-report=term
      - name: Docs are up to date
        run: uv run python scripts/sync_docs.py --check

      - name: OpenAPI is up to date
        run: |
          uv run quotestack-server --dump-openapi > /tmp/openapi.yaml
          diff -u docs/api/openapi.yaml /tmp/openapi.yaml
