openapi: 3.1.0
info:
  title: quotestack API
  summary: 多源行情适配层
  version: 0.1.0
paths:
  /v1/resolve:
    get:
      tags:
      - instrument
      summary: 解析代码
      description: 把代码解析成内部标识，并返回各数据源的映射。纯规则解析，不发起网络请求。
      operationId: resolve_v1_resolve_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: STOCK
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/quote:
    get:
      tags:
      - market
      summary: 实时报价
      description: 返回单个标的的最新报价。上游失败且缓存仍在 max_stale 窗口内时，返回旧值并把 stale 置为 true。
      operationId: quote_v1_quote_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: STOCK
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      - name: max_age
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Max Age
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/quotes/batch:
    post:
      tags:
      - market
      summary: 批量报价
      description: 一次查询多个标的。返回列表与请求等长同序，单条失败不影响其余。
      operationId: quote_many_v1_quotes_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/history:
    get:
      tags:
      - market
      summary: K 线与分钟线
      description: 场外基金没有 K 线，请求它们返回 UNSUPPORTED，而不是空数组。
      operationId: history_v1_history_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: STOCK
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      - name: interval
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Interval'
          default: 1d
      - name: adjust
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Adjust'
          default: qfq
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 250
          title: Limit
      - name: max_age
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Max Age
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/nav:
    get:
      tags:
      - fund
      summary: 基金净值
      description: 场外基金只有每日净值，没有盘中报价。
      operationId: nav_v1_nav_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: FUND
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 250
          title: Limit
      - name: max_age
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Max Age
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profile:
    get:
      tags:
      - fund
      summary: 基金画像
      description: 基金类型、跟踪标的、业绩基准、规模、经理。
      operationId: profile_v1_profile_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: FUND
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/holdings:
    get:
      tags:
      - fund
      summary: 季度持仓
      description: 按季度倒序返回前十大重仓股。limit 是季度数，不是股票数。
      operationId: holdings_v1_holdings_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: FUND
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{4}Q[1-4]$
          - type: 'null'
          title: Before
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 40
          minimum: 1
          default: 4
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/benchmark:
    get:
      tags:
      - fund
      summary: 基准加权曲线
      description: 把业绩基准里的成分指数按权重加权。取不到数据的成分被剔除并报告，coverage 相应下降。
      operationId: benchmark_v1_benchmark_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: FUND
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/estimate:
    get:
      tags:
      - fund
      summary: 基金盘中估值
      description: 用跟踪指数或持仓推算当日涨跌。算不出来时返回 change_pct=null，不是 0——未知与零变化是两件事。
      operationId: estimate_v1_estimate_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 24
          title: Code
      - name: asset_class
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetClass'
          default: FUND
      - name: market
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Market'
          default: CN
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fx:
    get:
      tags:
      - market
      summary: 汇率
      description: 以 USD 为基准表做交叉换算，derived 标记该汇率是直接报价还是算出来的。
      operationId: fx_v1_fx_get
      parameters:
      - name: base
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z]{3}$
          title: Base
      - name: quote
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z]{3}$
          title: Quote
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/instruments:
    get:
      tags:
      - instrument
      summary: 市场列表
      description: 枚举一个市场的全部标的。列表只含静态元数据，不含行情。
      operationId: instruments_v1_instruments_get
      parameters:
      - name: asset_class
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AssetClass'
      - name: market
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Market'
      - name: listed
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Listed
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Page Size
      - name: tradable_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Tradable Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/healthz:
    get:
      tags:
      - ops
      summary: 运行状态
      description: 报告各源可用性、冷却状态、缓存占用，以及当前生效的配置。
      operationId: healthz_v1_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    Adjust:
      type: string
      enum:
      - none
      - qfq
      - hfq
      title: Adjust
      description: 'Price adjustment mode.


        Use ``NONE`` for money math and ``QFQ`` for charting.'
    AssetClass:
      type: string
      enum:
      - STOCK
      - FUND
      - CRYPTO
      title: AssetClass
      description: 'Business classification of a tradable object.


        Orthogonal to :class:`Market`: a US-listed ETF is ``FUND`` + ``US``.'
    BarModel:
      properties:
        date:
          type: string
          title: Date
        time:
          anyOf:
          - type: string
          - type: 'null'
          title: Time
        open:
          type: string
          title: Open
        high:
          type: string
          title: High
        low:
          type: string
          title: Low
        close:
          type: string
          title: Close
        volume:
          type: string
          title: Volume
          description: 成交量，十进制字符串
        amount:
          anyOf:
          - type: string
          - type: 'null'
          title: Amount
      type: object
      required:
      - date
      - open
      - high
      - low
      - close
      - volume
      title: BarModel
    BarsPayload:
      properties:
        bars:
          items:
            $ref: '#/components/schemas/BarModel'
          type: array
          title: Bars
        interval:
          type: string
          title: Interval
        adjust:
          type: string
          title: Adjust
        source:
          type: string
          title: Source
        fetched_at:
          type: string
          title: Fetched At
      type: object
      required:
      - bars
      - interval
      - adjust
      - source
      - fetched_at
      title: BarsPayload
    BarsResponse:
      properties:
        data:
          $ref: '#/components/schemas/BarsPayload'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: BarsResponse
    BatchPayload:
      properties:
        results:
          items:
            $ref: '#/components/schemas/QuoteResultModel'
          type: array
          title: Results
        fetched_at:
          type: string
          title: Fetched At
      type: object
      required:
      - results
      - fetched_at
      title: BatchPayload
    BatchRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchRequestItem'
          type: array
          maxItems: 200
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: BatchRequest
    BatchRequestItem:
      properties:
        code:
          type: string
          title: Code
        asset_class:
          type: string
          enum:
          - STOCK
          - FUND
          - CRYPTO
          title: Asset Class
          default: STOCK
        market:
          type: string
          enum:
          - CN
          - US
          - CRYPTO
          title: Market
          default: CN
      type: object
      required:
      - code
      title: BatchRequestItem
    BatchResponse:
      properties:
        data:
          $ref: '#/components/schemas/BatchPayload'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: BatchResponse
    BenchmarkComponentModel:
      properties:
        name:
          type: string
          title: Name
        weight:
          type: number
          title: Weight
        kind:
          type: string
          enum:
          - EQUITY
          - NON_EQUITY
          - UNKNOWN
          title: Kind
      type: object
      required:
      - name
      - weight
      - kind
      title: BenchmarkComponentModel
    BenchmarkModel:
      properties:
        text:
          type: string
          title: Text
        components:
          items:
            $ref: '#/components/schemas/BenchmarkComponentModel'
          type: array
          title: Components
        coverage:
          type: number
          title: Coverage
          description: 权重合计 / 100，小于 1 说明权重不全
      type: object
      required:
      - text
      - components
      - coverage
      title: BenchmarkModel
    BenchmarkPayload:
      properties:
        effective_start:
          anyOf:
          - type: string
          - type: 'null'
          title: Effective Start
        components_used:
          items:
            $ref: '#/components/schemas/CurveComponentModel'
          type: array
          title: Components Used
        components_dropped:
          items:
            type: string
          type: array
          title: Components Dropped
        coverage:
          type: number
          title: Coverage
        series:
          items:
            $ref: '#/components/schemas/BenchmarkPointModel'
          type: array
          title: Series
      type: object
      required:
      - components_used
      - components_dropped
      - coverage
      - series
      title: BenchmarkPayload
    BenchmarkPointModel:
      properties:
        date:
          type: string
          title: Date
        value:
          type: number
          title: Value
      type: object
      required:
      - date
      - value
      title: BenchmarkPointModel
    BenchmarkResponse:
      properties:
        data:
          $ref: '#/components/schemas/BenchmarkPayload'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: BenchmarkResponse
    CurveComponentModel:
      properties:
        name:
          type: string
          title: Name
        weight:
          type: number
          title: Weight
        kind:
          type: string
          title: Kind
      type: object
      required:
      - name
      - weight
      - kind
      title: CurveComponentModel
    EstimateModel:
      properties:
        change_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Change Pct
          description: Null when the estimate cannot be computed; zero means truly unchanged
        basis:
          type: string
          enum:
          - index
          - holdings
          - none
          title: Basis
        coverage:
          anyOf:
          - type: number
          - type: 'null'
          title: Coverage
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
        explanation:
          type: string
          title: Explanation
          default: ''
        benchmark_assumption:
          anyOf:
          - additionalProperties:
              items:
                type: string
              type: array
            type: object
          - type: 'null'
          title: Benchmark Assumption
      type: object
      required:
      - basis
      title: EstimateModel
    EstimateResponse:
      properties:
        data:
          $ref: '#/components/schemas/EstimateModel'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: EstimateResponse
    FxModel:
      properties:
        base:
          type: string
          title: Base
        quote:
          type: string
          title: Quote
        rate:
          type: string
          title: Rate
          description: 汇率，十进制字符串
        source:
          type: string
          title: Source
        as_of:
          type: string
          title: As Of
        derived:
          type: boolean
          title: Derived
      type: object
      required:
      - base
      - quote
      - rate
      - source
      - as_of
      - derived
      title: FxModel
    FxResponse:
      properties:
        data:
          $ref: '#/components/schemas/FxModel'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: FxResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthPayload:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
        config:
          additionalProperties: true
          type: object
          title: Config
        sources:
          additionalProperties: true
          type: object
          title: Sources
        cache:
          additionalProperties:
            type: integer
          type: object
          title: Cache
        recent_schema_changes:
          items:
            type: string
          type: array
          title: Recent Schema Changes
      type: object
      required:
      - status
      - config
      - sources
      - cache
      title: HealthPayload
    HealthResponse:
      properties:
        data:
          $ref: '#/components/schemas/HealthPayload'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: HealthResponse
    HoldingModel:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        weight:
          type: number
          title: Weight
      type: object
      required:
      - code
      - name
      - weight
      title: HoldingModel
    HoldingsPayload:
      properties:
        quarters:
          items:
            $ref: '#/components/schemas/QuarterModel'
          type: array
          title: Quarters
        has_more:
          type: boolean
          title: Has More
        next_before:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Before
      type: object
      required:
      - quarters
      - has_more
      title: HoldingsPayload
    HoldingsResponse:
      properties:
        data:
          $ref: '#/components/schemas/HoldingsPayload'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: HoldingsResponse
    InstrumentModel:
      properties:
        id:
          type: string
          title: Id
        code:
          type: string
          title: Code
        asset_class:
          type: string
          enum:
          - STOCK
          - FUND
          - CRYPTO
          title: Asset Class
        market:
          type: string
          enum:
          - CN
          - US
          - CRYPTO
          title: Market
        currency:
          type: string
          title: Currency
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
        confidence:
          type: string
          enum:
          - exact
          - inferred
          - partial
          title: Confidence
        aliases:
          additionalProperties:
            type: string
          type: object
          title: Aliases
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
      type: object
      required:
      - id
      - code
      - asset_class
      - market
      - currency
      - confidence
      title: InstrumentModel
    InstrumentResponse:
      properties:
        data:
          $ref: '#/components/schemas/InstrumentModel'
        error:
          type: 'null'
          title: Error
      type: object
      required:
      - data
      title: InstrumentResponse
    InstrumentSummaryModel:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        asset_class:
          type: string
          enum:
          - STOCK
          - FUND
          - CRYPTO
